apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exercise-ingress-(nama panggilan)
spec:
  ingressClassName: traefik # Tidak boleh diganti
  rules:
  - host: (nama panggilan).exercise.apps.k3s.zauqilab.com # ganti nama panggilan anda
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: exercise-svc-(nama panggilan)
            port:
              number: 80
