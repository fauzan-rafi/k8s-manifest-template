apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo
        args: ["-text=Halo dari Echo Server!"]
        ports:
        - containerPort: 5678